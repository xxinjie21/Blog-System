# =============================================
# 高性能缓存博客系统 - Docker Compose 编排
# 三个容器：mysql + redis + app
# 使用：docker compose up -d
# =============================================
services:
  mysql:
    image: mysql:9
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456          # root 密码，改了要同步 app 的 DB_PASSWORD
      MYSQL_DATABASE: blog_system              # 自动创建数据库
    ports:
      - "3307:3306"                            # 宿主 3307 → 容器 3306（避开本机 MySQL 的 3306）
    volumes:
      - mysql-data:/var/lib/mysql                              # 数据卷：容器删了数据还在
      - ./docs/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # 首次启动自动建表+种子数据
      - ./mysql.cnf:/etc/mysql/conf.d/charset.cnf:ro              # 客户端默认 utf8mb4，防初始化乱码
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:6-alpine
    container_name: blog-redis
    restart: unless-stopped
    ports:
      - "6380:6379"                            # 宿主 6380 → 容器 6379（避开本机 Redis 的 6379）
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .                                   # 用项目根目录 Dockerfile 构建
    container_name: blog-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy             # mysql 健康后才启动 app
      redis:
        condition: service_healthy             # redis 健康后才启动 app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker           # 激活 application-docker.yml
      DB_PASSWORD: 123456                      # 必须和 MYSQL_ROOT_PASSWORD 一致

volumes:
  mysql-data:
  redis-data:
