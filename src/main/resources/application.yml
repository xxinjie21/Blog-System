server:
  port: 8080

spring:
  application:
    name: high-performance-blog-system
  
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/blog_system?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    
    # HikariCP 连接池优化配置
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: BlogHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  
  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      # 连接超时时间
      timeout: 5000ms
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 20
          # 连接池最大阻塞等待时间
          max-wait: 3000ms
          # 连接池空闲连接数
          max-idle: 10
          # 连接池最小空闲连接数
          min-idle: 5
      # 集群配置（可选）
      # cluster:
      #   nodes: localhost:6379,localhost:6380
      #   max-redirects: 3
  
  # Jackson 序列化配置
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

  # Flyway 数据库迁移配置
  flyway:
    enabled: true                      # 应用启动时自动执行未执行的迁移脚本
    locations: classpath:db/migration  # 脚本目录（V1、V2 等带版本号的 SQL）
    encoding: UTF-8                    # 脚本编码，防中文乱码
    baseline-on-migrate: true          # 已有数据库时以当前版本为基线，不报错
    clean-disabled: true               # 生产安全边界：禁用 flyway clean，防误操作清库

# MyBatis-Plus 配置
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类包路径
  type-aliases-package: com.blog.entity
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # 开启日志输出
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  # 全局配置
  global-config:
    db-config:
      # 主键类型（自增）
      id-type: auto
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    root: INFO
    com.blog: DEBUG
    com.blog.mapper: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'

# 自定义配置
blog:
  cache:
    # 热点文章缓存过期时间（秒）
    hot-article-ttl: 1800
    # 文章详情缓存过期时间（秒）
    article-detail-ttl: 3600
    # 浏览量持久化间隔（秒）
    view-count-persist-interval: 300
    # 点赞数持久化间隔（秒）
    like-count-persist-interval: 300
  cors:
    # 允许的跨域来源（生产环境必须收口为具体域名，禁止 *）
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# JWT 配置
jwt:
  # 访问令牌密钥（HS256 要求至少 32 字节，生产环境务必通过环境变量注入，勿用默认值）
  access-secret: ${JWT_ACCESS_SECRET:blog-access-secret-change-me-in-production-2026}
  # 刷新令牌密钥（与 access 分离，刷新令牌泄露也不会暴露访问令牌签名能力）
  refresh-secret: ${JWT_REFRESH_SECRET:blog-refresh-secret-change-me-in-production-2026}
  # 访问令牌有效期（分钟）- 短时效，配合刷新令牌使用
  access-expire-minutes: 30
  # 刷新令牌有效期（天）- 长时效，用于换取新的访问令牌
  refresh-expire-days: 7
  # 登录防暴力破解
  login-lock:
    # 连续失败多少次锁定
    max-fail-attempts: 5
    # 锁定多少分钟
    lock-minutes: 10

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs          # API 文档 JSON 路径
  swagger-ui:
    path: /swagger-ui.html      # Swagger UI 入口
    operationsSorter: method    # 按 HTTP 方法排序
  group-configs:
    - group: auth
      display-name: 认证接口
      paths-to-match: /auth/**
    - group: article
      display-name: 文章接口
      paths-to-match: /articles/**
    - group: comment
      display-name: 评论接口
      paths-to-match: /comments/**
    - group: category
      display-name: 分类接口
      paths-to-match: /categories/**
    - group: tag
      display-name: 标签接口
      paths-to-match: /tags/**
