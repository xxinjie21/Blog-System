server:
  port: 8080

spring:
  application:
    name: high-performance-blog-system
  
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/blog_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    
    # HikariCP 连接池优化配置
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: BlogHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  
  # Redis 配置
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    # 连接超时时间
    timeout: 5000ms
    lettuce:
      pool:
        # 连接池最大连接数
        max-active: 20
        # 连接池最大阻塞等待时间
        max-wait: 3000ms
        # 连接池空闲连接数
        max-idle: 10
        # 连接池最小空闲连接数
        min-idle: 5
      # 集群配置（可选）
      # cluster:
      #   nodes: localhost:6379,localhost:6380
      #   max-redirects: 3
  
  # Jackson 序列化配置
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

# MyBatis-Plus 配置
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类包路径
  type-aliases-package: com.blog.entity
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # 开启日志输出
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  # 全局配置
  global-config:
    db-config:
      # 主键类型（自增）
      id-type: auto
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    root: INFO
    com.blog: DEBUG
    com.blog.mapper: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'

# 自定义配置
blog:
  cache:
    # 热点文章缓存过期时间（秒）
    hot-article-ttl: 1800
    # 文章详情缓存过期时间（秒）
    article-detail-ttl: 3600
    # 浏览量持久化间隔（秒）
    view-count-persist-interval: 300
    # 点赞数持久化间隔（秒）
    like-count-persist-interval: 300
